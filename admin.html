<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم القمة</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">▲ لوحة تحكم القمة</div><nav><a href="index.html">المتجر</a></nav></header><main class="admin"><div class="adminTop"><h1>لوحة التحكم</h1><button class="danger" onclick="resetData()">إعادة البيانات التجريبية</button></div><div class="stats"><div><b id="statProducts">0</b><span>منتج</span></div><div><b id="statOrders">0</b><span>طلبات</span></div><div><b id="statBalance">0.00$</b><span>رصيد تجريبي</span></div></div><section class="panel"><h2>إضافة منتج</h2><div class="formGrid"><input id="pName" placeholder="اسم المنتج"><input id="pPrice" type="number" step="0.01" placeholder="السعر بالدولار"><input id="pCat" placeholder="القسم"><input id="pImg" placeholder="رابط صورة المنتج"><textarea id="pDesc" placeholder="وصف المنتج"></textarea><button class="primary" onclick="addProduct()">إضافة المنتج</button></div></section><section class="panel"><h2>المنتجات الحالية</h2><div id="adminProducts"></div></section><section class="panel"><h2>الطلبات</h2><div id="orders"></div></section></main><script src="admin.js"></script></body></html>
